name: Release

# Pushing a v* tag publishes an image and a GitHub Release. It never deploys:
# deploys stay a manual click in Coolify (spec §9).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Publish the image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image:$GITHUB_REF_NAME" -t "$image:latest" .
          docker push --all-tags "$image"
      - name: Create the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

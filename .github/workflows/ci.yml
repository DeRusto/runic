name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # release.yml runs these first

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t runic:ci .
      - name: The image starts and serves the client
        run: |
          docker run -d --name runic -p 2567:2567 \
            -e JWT_SECRET=ci-only -e INVITE_CODE=ci-only runic:ci
          for _ in $(seq 30); do
            curl -fs http://localhost:2567/version.txt && exit 0
            sleep 1
          done
          docker logs runic
          exit 1

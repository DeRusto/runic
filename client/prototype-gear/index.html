<!doctype html>
<!-- PROTOTYPE, throwaway: how gear looks and swings. Never merged. Three tier treatments on the real scene. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gear prototype</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font: 13px system-ui, sans-serif;
        color: #eee;
      }
      canvas {
        display: block;
      }
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        width: 250px;
        padding: 10px;
        background: #000b;
        border-radius: 8px;
      }
      #panel label {
        display: block;
        margin: 8px 0 2px;
        color: #aaa;
      }
      #panel select,
      #panel input {
        width: 100%;
      }
      #state {
        margin-top: 10px;
        white-space: pre-wrap;
        font: 11px monospace;
        color: #9fd;
      }
      #switcher {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 6px 12px;
        background: #fff;
        color: #000;
        border-radius: 99px;
        box-shadow: 0 2px 10px #0008;
        font-weight: 600;
      }
      #hint {
        position: fixed;
        bottom: 16px;
        right: 12px;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <b>Gear prototype</b>
      <label>Doing</label>
      <select id="mode">
        <option>Fight</option>
        <option>Idle</option>
        <option>Run</option>
      </select>
      <label>Gear shows</label>
      <select id="shows">
        <option>Always</option>
        <option>Only in a fight</option>
      </select>
      <label>Armed swing</label>
      <select id="clip"></select>
      <label>Fight stance</label>
      <select id="stance"></select>
      <label>Contact at <span id="contactLabel"></span> ms</label>
      <input id="contact" type="range" min="0" max="1500" step="10" />
      <div>
        <button id="turn-left">Turn Q</button>
        <button id="turn-right">Turn E</button>
        <button id="resetZoom">Default zoom</button>
      </div>
      <div id="state"></div>
    </div>
    <div id="switcher">
      <button id="prev">←</button>
      <span id="variantLabel"></span>
      <button id="next">→</button>
    </div>
    <div id="hint">Left to right: bare, Copper, Iron, Emberite. Wheel zooms.</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

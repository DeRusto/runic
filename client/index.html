<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Runic</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b2330;
      }
      canvas {
        display: block;
      }
      #status {
        position: fixed;
        top: 8px;
        left: 8px;
        margin: 0;
        color: #eee;
        font: 12px system-ui;
      }
      #ground-label {
        position: fixed;
        pointer-events: none;
        color: #fff;
        font: 12px system-ui;
        text-shadow: 0 0 3px #000;
        white-space: pre;
        transform: translate(-50%, -100%);
      }
      /* The bar's and the Gear tab's slots show this in place of title, so a name can be coloured (spec §5). */
      #slot-tip {
        position: fixed;
        z-index: 1;
        pointer-events: none;
        padding: 3px 6px;
        border: 1px solid #555;
        background: #111;
        color: #fff;
        font: 12px system-ui;
        white-space: nowrap;
      }
      /* An improved item's name: dark shades on the brown panels, light ones on the dark bar and over the world (spec §5). */
      .uncommon,
      .rare {
        font-weight: 600;
      }
      .uncommon {
        color: #1f9a2c;
      }
      .rare {
        color: #2563c9;
      }
      :is(#bar, #slot-tip, #ground-label) .uncommon {
        color: #5fe36a;
      }
      :is(#bar, #slot-tip, #ground-label) .rare {
        color: #6fb0ff;
      }
      #overheads {
        position: fixed;
        inset: 0;
        overflow: hidden;
        /* Other players never catch a click (spec §7). */
        pointer-events: none;
        color: #fff;
        font: 12px system-ui;
        text-align: center;
        text-shadow: 0 0 3px #000;
      }
      #overheads > div {
        position: absolute;
        width: max-content;
        max-width: 240px;
        overflow-wrap: anywhere;
      }
      .said {
        color: #ffeb3b;
        font-weight: 600;
      }
      .bar {
        width: 44px;
        height: 5px;
        margin: 1px auto;
        background: #400;
        outline: 1px solid #000;
      }
      .bar[hidden] {
        display: none;
      }
      .bar i {
        display: block;
        height: 100%;
        background: #4caf50;
      }
      .pop {
        position: absolute;
        bottom: 100%;
        left: 50%;
        font: 700 16px system-ui;
        white-space: nowrap;
        animation: pop 0.9s ease-out forwards;
      }
      .pop.damage {
        color: #ff5a4a;
      }
      .pop.critical {
        font-size: 22px;
        color: #ffb02e;
      }
      .pop.miss {
        color: #5aa9ff;
      }
      .pop.blocked {
        color: #e8e8e8;
      }
      .pop.heal {
        color: #5fe36a;
      }
      .pop.pick {
        color: #ffd27a;
      }
      @keyframes pop {
        from {
          transform: translate(-50%, 0);
        }
        to {
          transform: translate(-50%, -32px);
          opacity: 0;
        }
      }
      #bar {
        position: fixed;
        inset: auto 0 0;
        display: grid;
        /* The right end's minimum fits its row of buttons at 800 px. */
        grid-template-columns: minmax(0, 1fr) auto minmax(272px, 1fr);
        gap: 8px;
        height: 160px;
        padding: 8px;
        box-sizing: border-box;
        background: linear-gradient(#1d1610, #120d09);
        border-top: 1px solid #8a6a44;
        color: #eee;
        font: 12px system-ui;
      }
      #bar[hidden] {
        display: none;
      }
      #chat {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
        min-height: 0;
      }
      #chat-lines {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-wrap: anywhere;
      }
      #chat-input {
        width: 100%;
        box-sizing: border-box;
        padding: 3px 6px;
        border: 1px solid #8a6a44;
        border-radius: 3px;
        outline: 0;
        background: #0b0806;
        color: inherit;
        font: inherit;
      }
      #chat-input:focus {
        border-color: #b08a5a;
      }
      #slots {
        display: grid;
        grid-template-columns: repeat(10, 36px);
        grid-auto-rows: 36px;
        gap: 2px;
      }
      #slots > button {
        position: relative;
        overflow: hidden;
        padding: 0;
        border: 0;
        border-radius: 3px;
        /* The square buttons' face, under the icon bottomBar.ts sets as --icon. */
        background:
          var(--icon, none) center / 32px no-repeat,
          linear-gradient(#1d1610, #120d09);
        box-shadow:
          0 0 0 1px #000,
          inset 0 0 0 1px #8a6a44;
        color: inherit;
        font-size: 10px;
      }
      #slots > button:hover {
        box-shadow:
          0 0 0 1px #000,
          inset 0 0 0 1px #b08a5a;
      }
      #slots > button::after {
        content: attr(data-count);
        position: absolute;
        right: 2px;
        bottom: 1px;
        color: #fff;
        font-weight: 700;
        text-shadow:
          -1px 0 #000,
          1px 0 #000,
          0 -1px #000,
          0 1px #000;
      }
      #slots > button[data-locked="true"] {
        filter: grayscale(1);
        opacity: 0.6;
      }
      #slot-menu {
        position: fixed;
        display: flex;
        flex-direction: column;
        padding: 2px;
        border: 1px solid #8a6a44;
        border-radius: 3px;
        background: linear-gradient(#1d1610, #120d09);
        box-shadow: 0 2px 8px #000a;
      }
      #slot-menu[hidden] {
        display: none;
      }
      #slot-menu button {
        padding: 4px 12px;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
      }
      #slot-menu button:hover,
      #slot-menu button:focus-visible {
        background: #3a2a1a;
      }
      #player-panel {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      #bar-buttons {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #skills {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-content: start;
        gap: 4px 8px;
      }
      #skills label {
        display: grid;
        grid-template-columns: auto auto;
        justify-content: space-between;
        gap: 0 6px;
        white-space: nowrap;
      }
      #skills label > span + span {
        opacity: 0.8;
      }
      #skills label[hidden] {
        display: none;
      }
      #skills p {
        grid-column: span 2;
        margin: 0;
        opacity: 0.7;
      }
      #skills progress {
        display: block;
        grid-column: span 2;
        width: 100%;
        height: 8px;
      }
      #character,
      #social-button {
        white-space: nowrap;
      }
      #character[aria-pressed="true"],
      #social-button[aria-pressed="true"] {
        outline: 2px solid #ffd27a;
      }
      #character kbd,
      #social-button kbd {
        font: inherit;
        opacity: 0.7;
      }
      /*
       * Hidden by visibility, not display, on the window and its panes: a box that goes away
       * can lose its scroll position, and each tab keeps its own (spec §7).
       */
      #sheet,
      #social {
        position: fixed;
        right: 8px;
        bottom: 168px;
        display: flex;
        flex-direction: column;
        width: 340px;
        height: 400px;
        max-height: calc(100vh - 176px);
        box-sizing: border-box;
        padding: 8px;
        border: 16px solid transparent;
        border-image: url(/ui/panel_brown.png) 20 fill stretch;
        color: #4a3018;
        font: 12px system-ui;
      }
      #sheet[hidden] {
        visibility: hidden;
      }
      /* On the left, so it and the sheet can both be open. */
      #social {
        right: auto;
        left: 8px;
        width: 240px;
      }
      #social[hidden] {
        display: none;
      }
      /* Only the list scrolls, so the tabs and the X stay in reach. */
      #social-friends,
      #social-ignores {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      #friends,
      #ignores {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #friends li,
      #ignores li {
        display: flex;
        justify-content: space-between;
        padding: 2px 0;
      }
      #friends li[data-online="false"] {
        opacity: 0.6;
      }
      #sheet h2,
      #social h2,
      #smithing h2,
      #pile h2 {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0 0 8px;
        font-size: 14px;
      }
      #sheet-close,
      #social-close,
      #smithing-close,
      #pile-close {
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        background: url(/ui/button_brown_close.png) center / 100% 100%;
      }
      #sheet-tabs,
      #social-tabs {
        display: flex;
        gap: 2px;
        margin-bottom: 8px;
        border-bottom: 2px solid #a26a35;
      }
      #sheet-tabs button,
      #social-tabs button {
        flex: 1;
        padding: 3px;
        border: 0;
        background: #c9a06a;
        color: #4a3018;
        font: inherit;
      }
      #sheet-tabs button[aria-selected="true"],
      #social-tabs button[aria-selected="true"] {
        background: #a26a35;
        color: #fff4dc;
        font-weight: 600;
      }
      #sheet-panes {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      .sheet-pane {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        /* The bar's space is always kept, so content never shifts. */
        scrollbar-gutter: stable;
        scrollbar-width: thin;
        padding-right: 10px;
      }
      .sheet-pane[hidden] {
        display: block;
        visibility: hidden;
      }
      #gear-slots {
        display: grid;
        grid-template-areas:
          "cape head neck"
          "weapon body shield"
          "hands legs ring"
          ". feet .";
        grid-template-columns: repeat(3, 64px);
        grid-auto-rows: 64px;
        gap: 8px;
        justify-content: center;
      }
      .gear-slot {
        width: 64px;
        height: 64px;
        padding: 0;
        border: 0;
        background: #6d4a28 center / 52px no-repeat;
        outline: 2px solid #a26a35;
        color: inherit;
        font: inherit;
        font-size: 11px;
      }
      .gear-slot[aria-disabled="true"] {
        color: #c9a77c;
        cursor: default;
      }
      .gear-slot:focus-visible {
        outline-color: #ffd27a;
      }
      #gear-details {
        min-height: 2.6em;
        margin: 8px 0 10px;
        text-align: center;
        font-size: 12px;
      }
      #toolbelt {
        display: grid;
        grid-template-columns: repeat(auto-fill, 44px);
        grid-auto-rows: 44px;
        gap: 4px;
        margin-top: 2px;
      }
      #toolbelt img {
        display: block;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding: 4px;
        background: #6d4a28;
        outline: 2px solid #a26a35;
        outline-offset: -2px;
      }
      #sheet-skills p {
        margin: 0 0 6px;
        opacity: 0.8;
      }
      #sheet-skills > div {
        display: grid;
        grid-template-columns: 1fr 22px;
        gap: 0 4px;
        align-items: center;
        margin-bottom: 4px;
      }
      #sheet-skills progress {
        grid-column: 1;
        width: 100%;
        height: 8px;
      }
      .pin {
        grid-row: 1 / span 2;
        grid-column: 2;
        width: 22px;
        height: 22px;
        padding: 2px;
        border: 0;
        border-radius: 3px;
        background: none;
        color: #a58a68;
      }
      .pin svg {
        display: block;
        width: 100%;
        height: 100%;
        fill: currentColor;
      }
      .pin:hover:not(:disabled) {
        background: #e8d3ae;
      }
      .pin[aria-pressed="true"] {
        color: #a8341f;
      }
      .pin:disabled {
        opacity: 0.35;
      }
      /* Narrow enough to stay clear of the player at the world's centre, even at 800 px. */
      #smithing,
      #pile {
        position: fixed;
        left: 8px;
        bottom: 168px;
        display: flex;
        flex-direction: column;
        width: 340px;
        max-height: calc(100vh - 176px);
        box-sizing: border-box;
        padding: 8px;
        border: 16px solid transparent;
        border-image: url(/ui/panel_brown.png) 20 fill stretch;
        color: #4a3018;
        font: 12px system-ui;
      }
      #smithing[hidden],
      #pile[hidden] {
        display: none;
      }
      #pile {
        width: 220px;
      }
      #pile-rows {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow-y: auto;
      }
      #pile-rows button {
        padding: 4px;
        border: 0;
        border-top: 1px solid #a26a35;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
      }
      #pile-rows button:hover,
      #pile-rows button:focus-visible {
        background: #e8d3ae;
      }
      /* Only the rows scroll, so the X stays in reach in a short window. */
      #smithing-rows {
        min-height: 0;
        overflow-y: auto;
      }
      /* One folding section per tier: the header names it, and a locked one its gate. */
      #smithing-rows details {
        padding: 2px 0;
        border-top: 1px solid #a26a35;
      }
      #smithing-rows details[hidden] {
        display: none;
      }
      #smithing-rows summary {
        padding: 3px 0;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
      }
      #smithing-rows summary span + span {
        margin-left: 6px;
        font-weight: 400;
        color: #7a5a38;
      }
      /* One line per item: icon, piece over its short cost, then the two buttons. */
      #smithing-rows details > div {
        display: grid;
        grid-template-columns: 24px 1fr auto auto;
        grid-template-rows: auto auto;
        column-gap: 6px;
        align-items: center;
        padding: 2px 0;
      }
      #smithing-rows details > div.cant {
        opacity: 0.55;
      }
      #smithing-rows img {
        grid-row: 1 / span 2;
        width: 24px;
        height: 24px;
      }
      #smithing-rows details > div > span:nth-of-type(1) {
        font-weight: 600;
      }
      #smithing-rows details > div > span:nth-of-type(2) {
        grid-column: 2;
        grid-row: 2;
        font-size: 11px;
        color: #7a5a38;
      }
      #smithing-rows button {
        grid-row: 1 / span 2;
        padding: 1px 4px 2px;
        border: 4px solid transparent;
        border-image: url(/ui/button_brown.png) 8 fill stretch;
        background: none;
        color: #4a3018;
        font: 600 11px system-ui;
        white-space: nowrap;
        cursor: pointer;
      }
      #smithing-rows button:hover:not(:disabled) {
        filter: brightness(1.12);
      }
      #smithing-rows button:active:not(:disabled) {
        transform: translateY(1px);
      }
      #smithing-rows button:disabled {
        border-image-source: url(/ui/button_grey.png);
        color: #777;
        cursor: default;
      }
      #too-narrow {
        position: fixed;
        top: 8px;
        left: 50%;
        display: none;
        margin: 0;
        padding: 4px 8px;
        transform: translateX(-50%);
        background: #151b25;
        color: #eee;
        font: 12px system-ui;
        white-space: nowrap;
      }
      @media (max-width: 799.98px) {
        #too-narrow {
          display: block;
        }
      }
      #turn {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 4px;
        text-align: center;
      }
      #turn button {
        width: 100%;
        padding: 0;
        font-size: 16px;
      }
      #turn kbd {
        font: inherit;
        opacity: 0.7;
      }
      #logout {
        white-space: nowrap;
      }
      #splash {
        position: fixed;
        inset: 0;
        background: #1b2330 url(/ui/splash.webp) center / cover;
      }
      /* Low on the splash, so the logo stays in view above it. */
      #loading,
      #login {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 6vh;
        width: min(480px, calc(100vw - 32px));
        margin: auto;
        box-sizing: border-box;
      }
      #loading {
        height: 12px;
        padding: 2px;
        border: 1px solid #d9b25c;
        border-radius: 6px;
        background: rgb(10 20 35 / 0.75);
        box-shadow: 0 0 12px #3fa9ff88;
      }
      #loading i {
        display: block;
        width: 0;
        height: 100%;
        border-radius: 4px;
        background: linear-gradient(90deg, #2f8fe8, #8fdcff);
        transition: width 0.2s;
      }
      #loading[data-failed] {
        height: auto;
        padding: 8px;
        color: #fff;
        font: 16px system-ui;
        text-align: center;
      }
      /* A short window has no room below the logo, so the form takes the lowest spot and scrolls. */
      @media (max-height: 560px) {
        #loading,
        #login {
          bottom: 8px;
        }
      }
      #login {
        max-height: calc(100vh - 16px);
        overflow-y: auto;
        width: min(300px, calc(100vw - 32px));
        display: grid;
        gap: 8px;
        padding: 16px;
        border: 2px solid #d9b25c;
        border-radius: 8px;
        background: rgb(10 20 35 / 0.82);
        box-shadow: 0 0 16px #3fa9ff66;
        color: #f3e6c4;
        font: 14px system-ui;
      }
      #login input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 2px;
        padding: 6px;
        border: 1px solid #6d5a32;
        border-radius: 4px;
        background: #0d1726;
        color: #fff;
        font: inherit;
      }
      #login input:focus-visible {
        outline: 2px solid #8fdcff;
      }
      #login p {
        margin: 0;
        color: #ff8a80;
      }
      #login p:empty {
        display: none;
      }
      #login button {
        padding: 8px;
        border: 0;
        border-radius: 4px;
        background: linear-gradient(#f0c96a, #b88a2e);
        color: #2a1c06;
        font: 600 14px system-ui;
      }
      #login button:disabled {
        opacity: 0.6;
      }
      #login button[type="button"] {
        padding: 2px;
        background: none;
        color: #8fdcff;
        font-weight: 400;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <p id="status">Connecting…</p>
    <div id="overheads"></div>
    <div id="ground-label" role="tooltip" hidden></div>
    <div id="slot-tip" role="tooltip" hidden></div>
    <!-- Before the bar, so the bar's right-click menu shows above it. -->
    <section id="sheet" role="dialog" aria-label="Character" hidden>
      <h2>
        Character
        <button id="sheet-close" type="button" aria-label="Close"></button>
      </h2>
      <div id="sheet-tabs" role="tablist">
        <button
          id="sheet-tab-gear"
          type="button"
          role="tab"
          aria-selected="true"
        >
          Gear
        </button>
        <button
          id="sheet-tab-skills"
          type="button"
          role="tab"
          aria-selected="false"
        >
          Skills
        </button>
      </div>
      <div id="sheet-panes">
        <div id="sheet-gear" class="sheet-pane" role="tabpanel">
          <div id="gear-slots"></div>
          <p id="gear-details"></p>
          Toolbelt
          <div id="toolbelt"></div>
        </div>
        <div id="sheet-skills" class="sheet-pane" role="tabpanel" hidden></div>
      </div>
    </section>
    <section id="social" role="dialog" aria-label="Social" hidden>
      <h2>
        Social
        <button id="social-close" type="button" aria-label="Close"></button>
      </h2>
      <div id="social-tabs" role="tablist">
        <button
          id="social-tab-friends"
          type="button"
          role="tab"
          aria-selected="true"
        >
          Friends
        </button>
        <button
          id="social-tab-ignores"
          type="button"
          role="tab"
          aria-selected="false"
        >
          Ignore
        </button>
      </div>
      <div id="social-friends" role="tabpanel">
        <ul id="friends" aria-label="Friends list"></ul>
      </div>
      <div id="social-ignores" role="tabpanel" hidden>
        <ul id="ignores" aria-label="Ignore list"></ul>
      </div>
    </section>
    <section
      id="smithing"
      role="dialog"
      aria-labelledby="smithing-title"
      hidden
    >
      <h2>
        <span id="smithing-title"></span>
        <button id="smithing-close" type="button" aria-label="Close"></button>
      </h2>
      <div id="smithing-rows"></div>
    </section>
    <section id="pile" role="dialog" aria-labelledby="pile-title" hidden>
      <h2>
        <span id="pile-title">Pile</span>
        <button id="pile-close" type="button" aria-label="Close"></button>
      </h2>
      <div id="pile-rows"></div>
    </section>
    <section id="bar" hidden>
      <div id="chat">
        <div id="chat-lines" role="log" aria-label="Chat"></div>
        <form id="chat-form">
          <input id="chat-input" aria-label="Say" autocomplete="off" />
        </form>
      </div>
      <div id="slots" aria-label="Inventory"></div>
      <div id="slot-menu" role="menu" hidden></div>
      <div id="player-panel">
        <div id="health"></div>
        <div id="skills"></div>
        <div id="bar-buttons">
          <div id="turn">
            <button
              id="turn-left"
              type="button"
              aria-label="Turn view left"
              aria-keyshortcuts="Q"
            >
              ⟲
            </button>
            <button
              id="turn-right"
              type="button"
              aria-label="Turn view right"
              aria-keyshortcuts="E"
            >
              ⟳
            </button>
            <kbd>Q</kbd>
            <kbd>E</kbd>
          </div>
          <button
            id="character"
            type="button"
            aria-pressed="false"
            aria-keyshortcuts="C"
          >
            Character <kbd>C</kbd>
          </button>
          <button
            id="social-button"
            type="button"

          <button id="logout" type="button">Log out</button>

  </body>

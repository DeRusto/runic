<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Runic</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b2330;
      }
      canvas {
        display: block;
      }
      #status {
        position: fixed;
        top: 8px;
        left: 8px;
        margin: 0;
        color: #eee;
        font: 12px system-ui;
      }
      #overheads {
        position: fixed;
        inset: 0;
        overflow: hidden;
        /* Other players never catch a click (spec §7). */
        pointer-events: none;
        color: #fff;
        font: 12px system-ui;
        text-align: center;
        text-shadow: 0 0 3px #000;
      }
      #overheads > div {
        position: absolute;
        width: max-content;
        max-width: 240px;
        overflow-wrap: anywhere;
      }
      .said {
        color: #ffeb3b;
        font-weight: 600;
      }
      .bar {
        width: 44px;
        height: 5px;
        margin: 1px auto;
        background: #400;
        outline: 1px solid #000;
      }
      .bar[hidden] {
        display: none;
      }
      .bar i {
        display: block;
        height: 100%;
        background: #4caf50;
      }
      .pop {
        position: absolute;
        bottom: 100%;
        left: 50%;
        font: 700 16px system-ui;
        white-space: nowrap;
        animation: pop 0.9s ease-out forwards;
      }
      .pop.damage {
        color: #ff5a4a;
      }
      .pop.miss {
        color: #5aa9ff;
      }
      .pop.heal {
        color: #5fe36a;
      }
      .pop.pick {
        color: #ffd27a;
      }
      @keyframes pop {
        from {
          transform: translate(-50%, 0);
        }
        to {
          transform: translate(-50%, -32px);
          opacity: 0;
        }
      }
      #bar {
        position: fixed;
        inset: auto 0 0;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 8px;
        height: 132px;
        padding: 8px;
        box-sizing: border-box;
        background: #232c3a;
        color: #eee;
        font: 12px system-ui;
      }
      #bar[hidden] {
        display: none;
      }
      #chat {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      #chat-lines {
        flex: 1;
        overflow-y: auto;
        overflow-wrap: anywhere;
      }
      #chat-input {
        width: 100%;
        box-sizing: border-box;
      }
      #slots {
        display: grid;
        grid-template-columns: repeat(10, 36px);
        grid-auto-rows: 36px;
        gap: 2px;
      }
      #slots > button {
        position: relative;
        overflow: hidden;
        padding: 0;
        border: 0;
        background: #151b25;
        color: inherit;
        font-size: 10px;
      }
      #slots > button::after {
        content: attr(data-count);
        position: absolute;
        right: 2px;
        bottom: 1px;
        color: #fff;
        font-weight: 700;
        text-shadow:
          -1px 0 #000,
          1px 0 #000,
          0 -1px #000,
          0 1px #000;
      }
      #slot-menu {
        position: fixed;
        display: flex;
        flex-direction: column;
        padding: 2px;
        background: #151b25;
        outline: 1px solid #000;
      }
      #slot-menu[hidden] {
        display: none;
      }
      #slot-menu button {
        padding: 4px 12px;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
      }
      #slot-menu button:hover,
      #slot-menu button:focus-visible {
        background: #2f3b4d;
      }
      #player-panel {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 8px;
        min-width: 0;
      }
      #skills {
        grid-row: span 3;
        display: grid;
        align-content: start;
        gap: 2px;
      }
      #skills label {
        display: grid;
        grid-template-columns: 84px 1fr;
        align-items: center;
      }
      #skills progress {
        width: 100%;
      }
      #turn {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 4px;
        text-align: center;
      }
      #turn button {
        width: 100%;
        padding: 0;
        font-size: 16px;
      }
      #turn kbd {
        font: inherit;
        opacity: 0.7;
      }
      #logout {
        align-self: end;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        margin: 0;
        background: #1b2330;
        color: #eee;
        font: 16px system-ui;
      }
    </style>
  </head>
  <body>
    <p id="status">Connecting…</p>
    <div id="overheads"></div>
    <section id="bar" hidden>
      <div id="chat">
        <div id="chat-lines" role="log" aria-label="Chat"></div>
        <form id="chat-form">
          <input id="chat-input" aria-label="Say" autocomplete="off" />
        </form>
      </div>
      <div id="slots" aria-label="Inventory"></div>
      <div id="slot-menu" role="menu" hidden></div>
      <div id="player-panel">
        <div id="skills"></div>
        <div id="health"></div>
        <div id="turn">
          <button
            id="turn-left"
            type="button"
            aria-label="Turn view left"
            aria-keyshortcuts="Q"
          >
            ⟲
          </button>
          <button
            id="turn-right"
            type="button"
            aria-label="Turn view right"
            aria-keyshortcuts="E"
          >
            ⟳
          </button>
          <kbd>Q</kbd>
          <kbd>E</kbd>
        </div>
        <button id="logout" type="button">Log out</button>
      </div>
    </section>
    <p id="loading">Loading…</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

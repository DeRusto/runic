<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Runic</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b2330;
      }
      canvas {
        display: block;
      }
      #status {
        position: fixed;
        top: 8px;
        left: 8px;
        margin: 0;
        color: #eee;
        font: 12px system-ui;
      }
      #overheads {
        position: fixed;
        inset: 0;
        overflow: hidden;
        /* Other players never catch a click (spec §7). */
        pointer-events: none;
        color: #fff;
        font: 12px system-ui;
        text-align: center;
        text-shadow: 0 0 3px #000;
      }
      #overheads > div {
        position: absolute;
        width: max-content;
        max-width: 240px;
        overflow-wrap: anywhere;
      }
      .said {
        color: #ffeb3b;
        font-weight: 600;
      }
      .bar {
        width: 44px;
        height: 5px;
        margin: 1px auto;
        background: #400;
        outline: 1px solid #000;
      }
      .bar[hidden] {
        display: none;
      }
      .bar i {
        display: block;
        height: 100%;
        background: #4caf50;
      }
      .pop {
        position: absolute;
        bottom: 100%;
        left: 50%;
        font: 700 16px system-ui;
        white-space: nowrap;
        animation: pop 0.9s ease-out forwards;
      }
      .pop.damage {
        color: #ff5a4a;
      }
      .pop.miss {
        color: #5aa9ff;
      }
      .pop.pick {
        color: #ffd27a;
      }
      @keyframes pop {
        from {
          transform: translate(-50%, 0);
        }
        to {
          transform: translate(-50%, -32px);
          opacity: 0;
        }
      }
      #bar {
        position: fixed;
        inset: auto 0 0;
        display: grid;
        /* The right end's minimum fits two skills across beside its buttons at 800 px. */
        grid-template-columns: minmax(0, 1fr) auto minmax(236px, 1fr);
        gap: 8px;
        height: 132px;
        padding: 8px;
        box-sizing: border-box;
        background: #232c3a;
        color: #eee;
        font: 12px system-ui;
      }
      #bar[hidden] {
        display: none;
      }
      #chat {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      #chat-lines {
        flex: 1;
        overflow-y: auto;
        overflow-wrap: anywhere;
      }
      #chat-input {
        width: 100%;
        box-sizing: border-box;
      }
      #slots {
        display: grid;
        grid-template-columns: repeat(10, 36px);
        grid-auto-rows: 36px;
        gap: 2px;
      }
      #slots > button {
        position: relative;
        overflow: hidden;
        padding: 0;
        border: 0;
        background: #151b25;
        color: inherit;
        font-size: 10px;
      }
      #slots > button::after {
        content: attr(data-count);
        position: absolute;
        right: 2px;
        bottom: 1px;
        color: #fff;
        font-weight: 700;
        text-shadow:
          -1px 0 #000,
          1px 0 #000,
          0 -1px #000,
          0 1px #000;
      }
      #slot-menu {
        position: fixed;
        display: flex;
        flex-direction: column;
        padding: 2px;
        background: #151b25;
        outline: 1px solid #000;
      }
      #slot-menu[hidden] {
        display: none;
      }
      #slot-menu button {
        padding: 4px 12px;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
      }
      #slot-menu button:hover,
      #slot-menu button:focus-visible {
        background: #2f3b4d;
      }
      #player-panel {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 8px;
        min-width: 0;
      }
      #skills {
        grid-row: span 4;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-content: start;
        gap: 4px 8px;
      }
      #skills label {
        display: block;
        white-space: nowrap;
      }
      #skills label[hidden] {
        display: none;
      }
      #skills p {
        grid-column: span 2;
        margin: 0;
        opacity: 0.7;
      }
      #skills progress {
        display: block;
        width: 100%;
        height: 8px;
      }
      #character {
        white-space: nowrap;
      }
      #character[aria-pressed="true"] {
        outline: 2px solid #ffd27a;
      }
      #character kbd {
        font: inherit;
        opacity: 0.7;
      }
      /*
       * Hidden by visibility, not display, on the window and its panes: a box that goes away
       * can lose its scroll position, and each tab keeps its own (spec §7).
       */
      #sheet {
        position: fixed;
        right: 8px;
        bottom: 140px;
        display: flex;
        flex-direction: column;
        width: 340px;
        height: 400px;
        max-height: calc(100vh - 148px);
        box-sizing: border-box;
        padding: 8px;
        border: 16px solid transparent;
        border-image: url(/ui/panel_brown.png) 20 fill stretch;
        color: #4a3018;
        font: 12px system-ui;
      }
      #sheet[hidden] {
        visibility: hidden;
      }
      #sheet h2 {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0 0 8px;
        font-size: 14px;
      }
      #sheet-close {
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        background: url(/ui/button_brown_close.png) center / 100% 100%;
      }
      #sheet-tabs {
        display: flex;
        gap: 2px;
        margin-bottom: 8px;
        border-bottom: 2px solid #a26a35;
      }
      #sheet-tabs button {
        flex: 1;
        padding: 3px;
        border: 0;
        background: #c9a06a;
        color: #4a3018;
        font: inherit;
      }
      #sheet-tabs button[aria-selected="true"] {
        background: #a26a35;
        color: #fff4dc;
        font-weight: 600;
      }
      #sheet-panes {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      .sheet-pane {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        /* The bar's space is always kept, so content never shifts. */
        scrollbar-gutter: stable;
        scrollbar-width: thin;
        padding-right: 10px;
      }
      .sheet-pane[hidden] {
        display: block;
        visibility: hidden;
      }
      #gear-slots {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 10px;
        text-align: center;
      }
      .gear-slot {
        width: 64px;
        height: 64px;
        margin: 2px auto;
        background: #6d4a28;
        outline: 2px solid #a26a35;
      }
      #gear-slots b {
        font-weight: 600;
      }
      #toolbelt {
        display: grid;
        grid-template-columns: repeat(auto-fill, 44px);
        grid-auto-rows: 44px;
        gap: 4px;
        margin-top: 2px;
      }
      #sheet-skills p {
        margin: 0 0 6px;
        opacity: 0.8;
      }
      #sheet-skills > div {
        display: grid;
        grid-template-columns: 1fr 22px;
        gap: 0 4px;
        align-items: center;
        margin-bottom: 4px;
      }
      #sheet-skills progress {
        grid-column: 1;
        width: 100%;
        height: 8px;
      }
      .pin {
        grid-row: 1 / span 2;
        grid-column: 2;
        width: 22px;
        height: 22px;
        padding: 2px;
        border: 0;
        border-radius: 3px;
        background: none;
        color: #a58a68;
      }
      .pin svg {
        display: block;
        width: 100%;
        height: 100%;
        fill: currentColor;
      }
      .pin:hover:not(:disabled) {
        background: #e8d3ae;
      }
      .pin[aria-pressed="true"] {
        color: #a8341f;
      }
      .pin:disabled {
        opacity: 0.35;
      }
      #too-narrow {
        position: fixed;
        top: 8px;
        left: 50%;
        display: none;
        margin: 0;
        padding: 4px 8px;
        transform: translateX(-50%);
        background: #151b25;
        color: #eee;
        font: 12px system-ui;
        white-space: nowrap;
      }
      @media (max-width: 799.98px) {
        #too-narrow {
          display: block;
        }
      }
      #turn {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 4px;
        text-align: center;
      }
      #turn button {
        width: 100%;
        padding: 0;
        font-size: 16px;
      }
      #turn kbd {
        font: inherit;
        opacity: 0.7;
      }
      #logout {
        align-self: end;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        margin: 0;
        background: #1b2330;
        color: #eee;
        font: 16px system-ui;
      }
    </style>
  </head>
  <body>
    <p id="status">Connecting…</p>
    <div id="overheads"></div>
    <!-- Before the bar, so the bar's right-click menu shows above it. -->
    <section id="sheet" role="dialog" aria-label="Character" hidden>
      <h2>
        Character
        <button id="sheet-close" type="button" aria-label="Close"></button>
      </h2>
      <div id="sheet-tabs" role="tablist">
        <button
          id="sheet-tab-gear"
          type="button"
          role="tab"
          aria-selected="true"
        >
          Gear
        </button>
        <button
          id="sheet-tab-skills"
          type="button"
          role="tab"
          aria-selected="false"
        >
          Skills
        </button>
      </div>
      <div id="sheet-panes">
        <div id="sheet-gear" class="sheet-pane" role="tabpanel">
          <div id="gear-slots">
            <div>
              Weapon
              <div class="gear-slot"></div>
              <b>Empty</b>
            </div>
            <div>
              Shield
              <div class="gear-slot"></div>
              <b>Empty</b>
            </div>
          </div>
          Toolbelt
          <div id="toolbelt"></div>
        </div>
        <div id="sheet-skills" class="sheet-pane" role="tabpanel" hidden></div>
      </div>
    </section>
    <section id="bar" hidden>
      <div id="chat">
        <div id="chat-lines" role="log" aria-label="Chat"></div>
        <form id="chat-form">
          <input id="chat-input" aria-label="Say" autocomplete="off" />
        </form>
      </div>
      <div id="slots" aria-label="Inventory"></div>
      <div id="slot-menu" role="menu" hidden></div>
      <div id="player-panel">
        <div id="skills"></div>
        <div id="health"></div>
        <div id="turn">
          <button
            id="turn-left"
            type="button"
            aria-label="Turn view left"
            aria-keyshortcuts="Q"
          >
            ⟲
          </button>
          <button
            id="turn-right"
            type="button"
            aria-label="Turn view right"
            aria-keyshortcuts="E"
          >
            ⟳
          </button>
          <kbd>Q</kbd>
          <kbd>E</kbd>
        </div>
        <button
          id="character"
          type="button"
          aria-pressed="false"
          aria-keyshortcuts="C"
        >
          Character <kbd>C</kbd>
        </button>
        <button id="logout" type="button">Log out</button>
      </div>
    </section>
    <p id="too-narrow">This game needs a window at least 800 px wide.</p>
    <p id="loading">Loading…</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

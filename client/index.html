<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Runic</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b2330;
      }
      canvas {
        display: block;
      }
      #ticks {
        position: fixed;
        top: 8px;
        left: 8px;
        margin: 0;
        color: #eee;
        font: 12px system-ui;
      }
      #logout {
        position: fixed;
        top: 8px;
        right: 8px;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        margin: 0;
        background: #1b2330;
        color: #eee;
        font: 16px system-ui;
      }
    </style>
  </head>
  <body>
    <p id="ticks">Connecting…</p>
    <button id="logout" type="button" hidden>Log out</button>
    <p id="loading">Loading…</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
